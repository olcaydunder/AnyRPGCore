#cloud-config
# Ötüken Destanı oyun sunucusu - kiralık sunucuya (Hetzner Cloud, Ubuntu 24.04, x86) kurulum.
# Sunucuyu oluştururken "Cloud config" alanına bu dosyanın TAMAMI yapıştırılır; başka bir şey gerekmez.
#
# Ne yapar:
#  - "otuken" adlı yetkisiz bir kullanıcı açar, 2 GB takas alanı ekler
#  - /usr/local/bin/otuken-guncelle: GitHub'daki "sunucu" sürümüne bakar (surum.txt); yeni sürüm varsa
#    OtukenSunucu.zip'i indirir, kurar, oyunu yeniden başlatır. 5 dakikada bir çalışır (systemd zamanlayıcı).
#  - otuken.service: oyunu başsız sunucu kipinde çalıştırır (UDP 7770), çökerse 10 sn sonra yeniden açar.
#    Günlük: journalctl -u otuken  (hesaplar ve karakterler /var/lib/otuken altında kalır, güncellemede silinmez)
# Şifre, anahtar, jeton içermez; sunucu yalnız herkese açık sürüm dosyalarını indirir.

package_update: true
packages:
  - unzip
  - curl
  - ca-certificates
  - libglib2.0-0t64
  - libgl1
  - libxcursor1
  - libxrandr2
  - libxi6

users:
  - default
  - name: otuken
    system: true
    homedir: /var/lib/otuken
    shell: /usr/sbin/nologin

write_files:
  - path: /usr/local/bin/otuken-guncelle
    permissions: '0755'
    content: |
      #!/bin/bash
      # yeni oyun sunucusu sürümü varsa indirir, kurar, yeniden başlatır
      set -uo pipefail
      DEPO="https://github.com/olcaydunder/AnyRPGCore/releases/download/sunucu"
      KLASOR=/opt/otuken
      mkdir -p "$KLASOR"
      yeni=$(curl -fsSL --retry 3 "$DEPO/surum.txt" | tr -d '[:space:]') || exit 0
      [ -n "$yeni" ] || exit 0
      eski=$(cat "$KLASOR/surum.txt" 2>/dev/null || true)
      if [ "$yeni" = "$eski" ] && [ -d "$KLASOR/oyun" ]; then
        exit 0
      fi
      gecici=$(mktemp -d)
      if ! curl -fsSL --retry 3 -o "$gecici/sunucu.zip" "$DEPO/OtukenSunucu.zip"; then
        rm -rf "$gecici"; exit 0
      fi
      if ! unzip -q "$gecici/sunucu.zip" -d "$gecici/oyun"; then
        rm -rf "$gecici"; exit 0
      fi
      chmod +x "$gecici"/oyun/*.x86_64
      systemctl stop otuken || true
      rm -rf "$KLASOR/oyun.eski"
      [ -d "$KLASOR/oyun" ] && mv "$KLASOR/oyun" "$KLASOR/oyun.eski"
      mv "$gecici/oyun" "$KLASOR/oyun"
      echo "$yeni" > "$KLASOR/surum.txt"
      chown -R otuken: "$KLASOR"
      rm -rf "$gecici"
      systemctl start otuken
      logger -t otuken "oyun sunucusu $yeni kuruldu"

  - path: /etc/systemd/system/otuken.service
    content: |
      [Unit]
      Description=Otuken Destani oyun sunucusu
      After=network-online.target
      Wants=network-online.target

      [Service]
      User=otuken
      Environment=HOME=/var/lib/otuken
      WorkingDirectory=/opt/otuken/oyun
      ExecStart=/bin/sh -c 'exec /opt/otuken/oyun/*.x86_64 -batchmode -nographics --serverport 7770 --servermode MMO -logFile -'
      Restart=always
      RestartSec=10
      LimitNOFILE=65536

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/otuken-guncelle.service
    content: |
      [Unit]
      Description=Otuken oyun sunucusu guncelleyici
      After=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/otuken-guncelle

  - path: /etc/systemd/system/otuken-guncelle.timer
    content: |
      [Unit]
      Description=Otuken oyun sunucusu guncelleyici (5 dakikada bir)

      [Timer]
      OnBootSec=1min
      OnUnitActiveSec=5min

      [Install]
      WantedBy=timers.target

runcmd:
  - [sh, -c, "fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab || true"]
  - [sh, -c, "mkdir -p /opt/otuken /var/lib/otuken && chown otuken: /opt/otuken /var/lib/otuken"]
  - [systemctl, daemon-reload]
  - [systemctl, enable, otuken.service]
  - [systemctl, enable, --now, otuken-guncelle.timer]
  - [sh, -c, "/usr/local/bin/otuken-guncelle || true"]
