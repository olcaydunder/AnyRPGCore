# Ötüken Destanı - Android APK'yı GitHub Actions'ta ücretsiz derler (GameCI).
#
# Depo herkese açık olduğu için GitHub'ın standart makinelerinde derleme dakikaları ücretsizdir.
# Kendiliğinden çalışmaz: GitHub'da Actions > "Android APK (ücretsiz)" > "Run workflow" ile başlatılır.
#
# Bir kez yapılacak ayar (Settings > Secrets and variables > Actions > New repository secret):
#   UNITY_LICENSE   Unity Hub'ın oluşturduğu Unity_lic.ulf dosyasının tam içeriği (<?xml ... ile başlar)
#   UNITY_EMAIL     Unity hesabının e-postası
#   UNITY_PASSWORD  Unity hesabının şifresi (hesapta iki adımlı doğrulama kapalı olmalı)
#   VARLIK_ANAHTARI lisanslı modellerin (Tools~/varliklar/*.tar.enc) şifre anahtarı
#   (isteğe bağlı) HATA_KANALI  hata bildirim kanalı; yoksa VARLIK_ANAHTARI'ndan türetilir ("Hata raporları" iş akışı)
#
# Çıktı:
#   - "son-apk" adlı ön sürümde OtukenDestani.apk (telefondan doğrudan indirilir, her derlemede yenilenir)
#     https://github.com/<sahip>/<depo>/releases/download/son-apk/OtukenDestani.apk
#   - aynı APK, çalıştırma sayfasında 5 gün saklanan bir zip olarak
#
# İmza: Tools~/android/gelistirme.keystore (şifresi Android'in standart test şifresi "android").
# Her derleme aynı anahtarla imzalandığı için yeni APK eskisinin üstüne kurulur, kayıtlar silinmez.
# Bu anahtar YALNIZCA test içindir; Google Play'e yüklenecek sürüm ayrı ve gizli bir anahtarla imzalanacak.

name: Android APK (ücretsiz)

on:
  workflow_dispatch:
    inputs:
      temiz_derleme:
        description: 'Önbelleği kullanmadan sıfırdan derle (garip bir hata olursa işaretle)'
        type: boolean
        default: false
      sadece_arayuz:
        description: 'Yalnız arayüz önizlemesi (haritalar işlenmez, APK derlenmez; hızlı deneme)'
        type: boolean
        default: false
      oyun_testi:
        description: 'Otomatik oyun testi (bot) çalışsın (hızlı denemede de)'
        type: boolean
        default: true
      sadece_sunucu:
        description: 'Yalnız Linux sunucu + çevrimiçi deneme (APK derlenmez, sunucu yayımlanmaz; hızlı ağ denemesi)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: android-apk
  cancel-in-progress: true

env:
  APK_ADI: OtukenDestani
  SURUM_ETIKETI: son-apk

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Unity lisansı ayarlı mı?
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          eksik=""
          [ -n "$UNITY_LICENSE" ] || eksik="$eksik UNITY_LICENSE"
          [ -n "$UNITY_EMAIL" ] || eksik="$eksik UNITY_EMAIL"
          [ -n "$UNITY_PASSWORD" ] || eksik="$eksik UNITY_PASSWORD"
          if [ -n "$eksik" ]; then
            echo "::error title=Unity lisansı eksik::Şu gizli anahtarlar yok:$eksik. Depo > Settings > Secrets and variables > Actions > New repository secret ile ekle."
            exit 1
          fi
          case "$UNITY_LICENSE" in
            *DeveloperData*) echo "Lisans dosyası tamam." ;;
            *) echo "::error title=Lisans dosyası hatalı::UNITY_LICENSE, Unity_lic.ulf dosyasının TAM içeriği olmalı (<?xml ile başlar, içinde DeveloperData geçer)."
               exit 1 ;;
          esac

      - name: Disk alanı aç
        uses: jlumbroso/free-disk-space@v2
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          preinstalled-runtimes: false
          swap-storage: false

      - name: Kodu indir
        uses: actions/checkout@v7

      - name: Lisanslı modelleri aç
        # Quaternius modelleri lisans gereği depoda şifreli durur (Tools~/dunya/canavarlar.py)
        env:
          VARLIK_ANAHTARI: ${{ secrets.VARLIK_ANAHTARI }}
        run: |
          shopt -s nullglob
          for arsiv in Tools~/varliklar/*.tar.enc; do
            if [ -z "$VARLIK_ANAHTARI" ]; then
              echo "::error title=Model anahtarı eksik::$arsiv şifreli. VARLIK_ANAHTARI gizli bilgisini ekle: Settings > Secrets and variables > Actions > New repository secret."
              exit 1
            fi
            if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$arsiv" -pass env:VARLIK_ANAHTARI | tar -xz; then
              echo "::error title=Model anahtarı yanlış::$arsiv açılamadı. VARLIK_ANAHTARI değerini kontrol et."
              exit 1
            fi
            echo "Açıldı: $arsiv"
          done

      - name: Unity önbelleği (Library)
        if: ${{ !inputs.temiz_derleme }}
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Hata bildirim kanalını oyuna yaz
        # depoya girmez (.gitignore). Kanal adı VARLIK_ANAHTARI'ndan türetilir ("Hata raporları" iş akışıyla aynı);
        # HATA_KANALI gizli bilgisi varsa o kullanılır
        env:
          HATA_KANALI: ${{ secrets.HATA_KANALI }}
          VARLIK_ANAHTARI: ${{ secrets.VARLIK_ANAHTARI }}
        run: |
          if [ -z "$HATA_KANALI" ] && [ -n "$VARLIK_ANAHTARI" ]; then
            HATA_KANALI="otuken-$(printf '%s' "${VARLIK_ANAHTARI}:hata-kanali" | sha256sum | cut -c1-24)"
          fi
          if [ -n "$HATA_KANALI" ]; then
            echo "::add-mask::$HATA_KANALI"
            printf '%s' "$HATA_KANALI" > Assets/Otuken/Resources/HataKanali.txt
            echo "Hata bildirimi açık."
          else
            echo "::warning title=Hata bildirimi kapalı::Kanal yok; oyun hataları göndermeyecek."
          fi

      - name: Sürüm numarası ve imza anahtarı
        id: hazirlik
        run: |
          echo "surum=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "kod=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "anahtar=$(base64 -w0 'Tools~/android/gelistirme.keystore')" >> "$GITHUB_OUTPUT"

      - name: Unity ile Android APK derle
        if: ${{ !inputs.sadece_sunucu }}
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildName: ${{ env.APK_ADI }}
          # önce haritaları hazırlar (yürüme ağı, tanı raporu, ekran görüntüleri), sonra standart GameCI derlemesi
          # (Assets/Otuken/Editor/HaritaHazirlik.cs, Assets/Editor/UnityBuilderAction)
          buildMethod: Otuken.EditorAraclari.Derleme.Derle
          customParameters: ${{ inputs.sadece_arayuz && '-sadeceArayuz' || '' }} -istemciSurumu ${{ steps.hazirlik.outputs.surum }}
          androidExportType: androidPackage
          versioning: Custom
          version: ${{ steps.hazirlik.outputs.surum }}
          androidVersionCode: ${{ steps.hazirlik.outputs.kod }}
          androidKeystoreName: gelistirme.keystore
          androidKeystoreBase64: ${{ steps.hazirlik.outputs.anahtar }}
          androidKeystorePass: android
          androidKeyaliasName: androiddebugkey
          androidKeyaliasPass: android

      - name: APK'yı bul
        if: ${{ !inputs.sadece_arayuz && !inputs.sadece_sunucu }}
        id: apk
        run: |
          apk=$(find build/Android -maxdepth 2 -name '*.apk' | head -n 1)
          if [ -z "$apk" ]; then
            echo "::error title=APK yok::Derleme bitti ama APK dosyası bulunamadı."
            exit 1
          fi
          boyut=$(stat -c %s "$apk")
          echo "yol=$apk" >> "$GITHUB_OUTPUT"
          echo "boyut_mb=$((boyut / 1048576))" >> "$GITHUB_OUTPUT"
          echo "APK: $apk ($((boyut / 1048576)) MB)"

      - name: APK'yı çalıştırma sayfasına ekle (5 gün)
        if: ${{ !inputs.sadece_arayuz && !inputs.sadece_sunucu }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_ADI }}-${{ steps.hazirlik.outputs.surum }}
          path: ${{ steps.apk.outputs.yol }}
          retention-days: 5
          compression-level: 0

      - name: Telefondan indirme bağlantısını yenile
        if: ${{ !inputs.sadece_arayuz && !inputs.sadece_sunucu && steps.apk.outputs.boyut_mb < 2000 }}
        env:
          GH_TOKEN: ${{ github.token }}
          APK_YOLU: ${{ steps.apk.outputs.yol }}
          SURUM: ${{ steps.hazirlik.outputs.surum }}
        run: |
          cp "$APK_YOLU" "${APK_ADI}.apk"
          baslik="Ötüken Destanı - son test sürümü ($SURUM)"
          notlar="Test sürümü $SURUM, $(date -u +'%d.%m.%Y %H:%M') UTC. Commit: ${GITHUB_SHA::8}. Telefona indirip kurun; eski test sürümünün üstüne kurulur."
          # sürüm silinip yeniden kurulmaz (bir derlemede taslak kalıp bağlantı kırılmıştı): dosya değiştirilir, yayımda tutulur
          if gh release view "$SURUM_ETIKETI" >/dev/null 2>&1; then
            gh release upload "$SURUM_ETIKETI" "${APK_ADI}.apk" --clobber
            gh release edit "$SURUM_ETIKETI" --title "$baslik" --notes "$notlar" --prerelease --draft=false
          else
            gh release create "$SURUM_ETIKETI" "${APK_ADI}.apk" --prerelease --target "$GITHUB_SHA" --title "$baslik" --notes "$notlar"
          fi
          link="https://github.com/${GITHUB_REPOSITORY}/releases/download/${SURUM_ETIKETI}/${APK_ADI}.apk"
          # telefondan indirme bağlantısı gerçekten açık mı (taslakta kalırsa 404 verir)
          for i in 1 2 3 4 5 6; do
            kod=$(curl -s -o /dev/null -w '%{http_code}' -L -r 0-0 "$link" || true)
            if [ "$kod" = "200" ] || [ "$kod" = "206" ]; then echo "indirme bağlantısı açık ($kod)"; break; fi
            echo "indirme bağlantısı $kod, sürüm yayımlanıyor ($i)"
            gh release edit "$SURUM_ETIKETI" --draft=false --prerelease || true
            sleep 10
          done
          if [ "$kod" != "200" ] && [ "$kod" != "206" ]; then
            echo "::warning title=APK bağlantısı::$link açılmıyor ($kod)"
          fi
          {
            echo "## Ötüken Destanı $SURUM hazır"
            echo ""
            echo "Telefondan indir: $link"
            echo ""
            echo "Boyut: ${{ steps.apk.outputs.boyut_mb }} MB"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Oyun testi (bot 15 haritayı gezer)
        # editörde oyun modunda: yeni oyun, 15 haritaya ışınlanma, otomatik av; hatalar tani/oyun_testi.* dosyalarına
        # (Assets/Otuken/Editor/OyunTesti.cs). APK zaten yayımlandı; bu adım tutmazsa derleme bozulmaz.
        # Lisans GameCI gibi etkinleştirilir (kişisel lisans dosyasındaki seri numarası + hesap) ve sonunda geri verilir.
        if: ${{ inputs.oyun_testi && !inputs.sadece_sunucu && (inputs.sadece_arayuz || steps.apk.outcome == 'success') }}
        continue-on-error: true
        timeout-minutes: 50
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          mkdir -p tani
          set +e
          UNITY_SERIAL=$(python3 - <<'PY'
          import base64, os, re
          m = re.search(r'<DeveloperData Value="([^"]*)"', os.environ.get("UNITY_LICENSE", ""))
          print(base64.b64decode(m.group(1)).decode("latin-1")[4:] if m else "")
          PY
          )
          echo "::add-mask::$UNITY_SERIAL"
          export UNITY_SERIAL
          docker images --format '{{.Size}} {{.Repository}}:{{.Tag}}'
          # GameCI derleme imajını BuildKit ile kurar (temel unityci/editor listede görünmeyebilir): en büyük imaj Unity'dir
          imaj=$(docker images --format '{{.Size}} {{.Repository}}:{{.Tag}}' | sort -h | tail -n 1 | awk '{print $2}')
          case "$imaj" in
            *unity*|*editor*|*builder*) ;;
            *) imaj="unityci/editor:ubuntu-6000.3.10f1-android-3"
               docker pull "$imaj" || { echo "::warning title=Oyun testi::Unity imajı yok"; exit 0; } ;;
          esac
          echo "imaj: $imaj"
          docker run --rm --entrypoint bash -v "$GITHUB_WORKSPACE":/github/workspace -w /github/workspace \
            -e UNITY_SERIAL -e UNITY_EMAIL -e UNITY_PASSWORD "$imaj" -c '
            unity-editor -logFile /github/workspace/tani/oyun_testi_lisans.log -quit -nographics \
              -serial "$UNITY_SERIAL" -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD"
            echo "lisans etkinleştirme çıkış kodu: $?"
            unity-editor -logFile /github/workspace/tani/oyun_testi_unity.log -projectPath /github/workspace \
              -buildTarget Android -executeMethod Otuken.EditorAraclari.OyunTesti.Baslat
            echo "oyun testi çıkış kodu: $?"
            unity-editor -logFile /github/workspace/tani/oyun_testi_lisans_iade.log -quit -nographics \
              -returnlicense -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD"
            echo "lisans iade çıkış kodu: $?"
          ' 2>&1 | tail -n 40
          # lisans günlüklerinde yalnız sonuç satırları kalsın
          for f in tani/oyun_testi_lisans.log tani/oyun_testi_lisans_iade.log; do
            [ -f "$f" ] && grep -i "licens\|activat\|error" "$f" | tail -n 30 > "$f.kisa" && mv "$f.kisa" "$f"
          done
          if [ -f tani/oyun_testi_unity.log ]; then
            tail -n 4000 tani/oyun_testi_unity.log > tani/oyun_testi_unity_son.log
            rm -f tani/oyun_testi_unity.log
            grep "\[OyunTesti\]" tani/oyun_testi_unity_son.log | tail -n 60
          fi
          if [ -f tani/oyun_testi.txt ]; then
            {
              echo "## Otomatik oyun testi"
              echo '```'
              head -c 30000 tani/oyun_testi.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Oyun testi::rapor çıkmadı (tani/oyun_testi_unity_son.log)"
          fi
          exit 0

      - name: Linux oyun sunucusunu derle (çevrimiçi oyun)
        # aynı çalışma alanında, telefon derlemesinden sonra: sahneler ve ağ kimlikleri APK ile aynı (AgHazirlik).
        # Tutmazsa APK etkilenmez.
        id: sunucu
        if: ${{ !inputs.sadece_arayuz && (inputs.sadece_sunucu || steps.apk.outcome == 'success') }}
        continue-on-error: true
        timeout-minutes: 90
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneLinux64
          buildName: OtukenSunucu
          buildMethod: Otuken.EditorAraclari.Derleme.SunucuDerle
          customParameters: -istemciSurumu ${{ steps.hazirlik.outputs.surum }} ${{ inputs.sadece_sunucu && '-haritalariHazirla' || '' }}
          # telefon derlemesi sahneleri işledi (yürüme ağı, ağ nesneleri): çalışma alanı bilerek "kirli"
          allowDirtyBuild: true
          versioning: Custom
          version: ${{ steps.hazirlik.outputs.surum }}

      - name: Sunucuyu dene ve yayımla
        # sunucu 2 dakika başsız çalıştırılır: "[Sunucu] başladı" ve UDP 7770 dinleniyor mu. Tutarsa "sunucu" ön
        # sürümüne OtukenSunucu.zip ve surum.txt yüklenir; kiralık sunucudaki güncelleyici (Tools~/ag/cloud-config.yaml)
        # yeni sürümü kendisi indirir.
        if: ${{ !inputs.sadece_arayuz && steps.sunucu.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
          SURUM: ${{ steps.hazirlik.outputs.surum }}
          YAYIMLA: ${{ !inputs.sadece_sunucu }}
        run: |
          mkdir -p tani
          set +e
          # derleme kapsayıcıda root olarak yazıldı: önce sahiplik, sonra arama
          sudo chown -R "$(id -u):$(id -g)" build/StandaloneLinux64 2>/dev/null
          ls -la build/StandaloneLinux64 | head -n 20
          ikili=$(find build/StandaloneLinux64 -maxdepth 2 -name '*.x86_64' 2>/dev/null | head -n 1)
          if [ -z "$ikili" ]; then
            echo "::warning title=Sunucu::derlendi ama .x86_64 dosyası yok"; ls -la build/StandaloneLinux64 || true; exit 0
          fi
          klasor=$(dirname "$ikili")
          cat "$klasor/derleme.txt" 2>/dev/null
          chmod +x "$ikili"
          "$ikili" -batchmode -nographics --serverport 7770 --servermode MMO -logFile "$PWD/tani/sunucu_deneme.log" &
          pid=$!
          basladi=0
          for i in $(seq 1 120); do
            sleep 1
            if grep -q "\[Sunucu\] başladı" tani/sunucu_deneme.log 2>/dev/null; then basladi=1; break; fi
            kill -0 $pid 2>/dev/null || break
          done
          sleep 5
          dinliyor=0
          ss -lun | grep -q ':7770' && dinliyor=1
          # çok oyunculu deneme: aynı dosyadan iki istemci botu sunucuya girer, dünyada 60 sn dolaşır (AnyRPG.AgBotu)
          if [ "$basladi" = "1" ]; then
            for b in Bot1 Bot2; do
              "$ikili" -batchmode -nographics -istemciBotu $b -adres 127.0.0.1:7770 -sure 60 \
                -rapor "$PWD/tani/ag_botu_$b.txt" -logFile "$PWD/tani/ag_botu_$b.log" &
              eval "pid_$b=\$!"
              sleep 8
            done
            for i in $(seq 1 300); do
              sleep 1
              kill -0 $pid_Bot1 2>/dev/null || kill -0 $pid_Bot2 2>/dev/null || break
            done
            kill -9 $pid_Bot1 $pid_Bot2 2>/dev/null || true
            for b in Bot1 Bot2; do
              echo "--- $b"; cat "tani/ag_botu_$b.txt" 2>/dev/null || echo "rapor yok"
              [ -f "tani/ag_botu_$b.log" ] && tail -n 2000 "tani/ag_botu_$b.log" > "tani/ag_botu_$b.son.log" && rm -f "tani/ag_botu_$b.log"
            done
          fi
          kill $pid 2>/dev/null; sleep 3; kill -9 $pid 2>/dev/null || true
          hata=$(grep -c -E "Exception|Error|error CS" tani/sunucu_deneme.log 2>/dev/null || true)
          echo "başladı=$basladi dinliyor=$dinliyor hata satırı=$hata"
          grep "\[Sunucu\]" tani/sunucu_deneme.log | tail -n 20 || true
          tail -n 3000 tani/sunucu_deneme.log > tani/sunucu_deneme_son.log 2>/dev/null; rm -f tani/sunucu_deneme.log
          printf 'surum=%s\nbasladi=%s\ndinliyor=%s\nhata_satiri=%s\n' "$SURUM" "$basladi" "$dinliyor" "$hata" > tani/sunucu_durum.txt
          if [ "$basladi" != "1" ]; then
            echo "::warning title=Sunucu::denemede açılmadı (tani/sunucu_deneme_son.log); yayımlanmadı"; exit 0
          fi
          for b in Bot1 Bot2; do echo "$b: $(grep 'SONUÇ' tani/ag_botu_$b.txt 2>/dev/null | tail -n 1)" >> "$GITHUB_STEP_SUMMARY"; done
          if [ "$YAYIMLA" != "true" ]; then
            echo "yalnız sunucu denemesi: yayımlanmadı"; exit 0
          fi
          (cd "$klasor" && zip -qr "$GITHUB_WORKSPACE/OtukenSunucu.zip" .)
          printf '%s\n' "$SURUM" > surum.txt
          ls -la OtukenSunucu.zip
          snotlar="Oyun sunucusu $SURUM (Linux, başsız). Telefon sürümü $SURUM ile eşleşir. Kiralık sunucu bunu kendisi indirir."
          if gh release view sunucu >/dev/null 2>&1; then
            gh release upload sunucu OtukenSunucu.zip surum.txt --clobber
            gh release edit sunucu --title "Oyun sunucusu ($SURUM)" --notes "$snotlar" --prerelease --draft=false || true
          else
            gh release create sunucu OtukenSunucu.zip surum.txt --prerelease --target "$GITHUB_SHA" --title "Oyun sunucusu ($SURUM)" --notes "$snotlar"
          fi
          {
            echo "## Oyun sunucusu $SURUM"
            echo "başladı: $basladi, UDP 7770: $dinliyor, boyut: $(( $(stat -c %s OtukenSunucu.zip) / 1048576 )) MB"
            for b in Bot1 Bot2; do echo ""; echo "$b: $(grep 'SONUÇ' tani/ag_botu_$b.txt 2>/dev/null | tail -n 1)"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tanı raporunu yükle (yürüme ağı, ekran görüntüleri)
        # derleme başarısız olsa bile: "tani" ön sürümünde tani.zip (rapor.txt, *.jpg, navmesh/)
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -d tani ]; then
            echo "tani klasörü yok"
            exit 0
          fi
          zip -qr tani.zip tani
          ls -la tani.zip
          tnotlar="Derleme $GITHUB_RUN_NUMBER, commit ${GITHUB_SHA::8}: yeni haritaların yürüme ağı, gölgelendirici denetimi ve ekran görüntüleri."
          if gh release view tani >/dev/null 2>&1; then
            gh release upload tani tani.zip --clobber
            gh release edit tani --notes "$tnotlar" --prerelease --draft=false || true
          else
            gh release create tani tani.zip --prerelease --target "$GITHUB_SHA" --title "Tanı raporu (otomatik, oyuncular için değil)" --notes "$tnotlar"
          fi
          if [ -f tani/rapor.txt ]; then
            {
              echo "## Tanı raporu"
              echo '```'
              head -c 60000 tani/rapor.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi


      # ---- hata panosu (hata-kayitlari dalı): son derlemenin sonucu ve tanı uyarıları
      # (APK adımlarından sonra ve hata verse bile derlemeyi bozmaz)
      - name: Hata panosu dalını indir
        if: ${{ always() && !inputs.sadece_arayuz && !inputs.sadece_sunucu && !cancelled() }}
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: hata-kayitlari
          path: kayit-dali

      - name: Derleme sonucunu hata panosuna yaz
        if: ${{ always() && !inputs.sadece_arayuz && !inputs.sadece_sunucu && !cancelled() }}
        continue-on-error: true
        env:
          SONUC: ${{ job.status }}
          DEPO: ${{ github.repository }}
          KAYIT_KLASORU: kayit-dali
        run: |
          [ -d kayit-dali ] || exit 0
          sonuc=basarisiz
          [ "$SONUC" = "success" ] && sonuc=basarili
          baglanti="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # "Hata raporları" iş akışı aynı anda yazmış olabilir: olmazsa son hâli alıp yeniden yaz
          for deneme in 1 2 3; do
            python3 'Tools~/hata/topla.py' derleme "$sonuc" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "$baglanti" tani/rapor.txt
            git -C kayit-dali add -A
            git -C kayit-dali diff --cached --quiet && exit 0
            git -C kayit-dali -c user.name="hata-raporlari[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Hata panosu: derleme $GITHUB_RUN_NUMBER ($sonuc)"
            git -C kayit-dali push -q origin HEAD:hata-kayitlari && exit 0
            sleep 5
            git -C kayit-dali fetch -q origin hata-kayitlari
            git -C kayit-dali reset -q --hard origin/hata-kayitlari
          done
          exit 1
